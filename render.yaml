# Render Blueprint: free web service for the FastAPI backend (ONNX Runtime, fits 512 MB RAM).
# Dashboard: New + > Blueprint > select this repository.
services:
  - type: web
    name: floor-inspection-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    # Only redeploy (and restart) the backend when backend files change, not on frontend pushes
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/tests/**
        - backend/ml/crack_detection/datasets/**
        - backend/ml/crack_detection/runs/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CRACK_INFERENCE_BACKEND
        value: onnx
      - key: INFERENCE_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: CRACK_MAX_TILES
        value: "6"
      - key: FRONTEND_URL
        value: https://floor-inspection-ai.vercel.app
      - key: CRACK_CONFIDENCE_THRESHOLD
        value: "0.25"
