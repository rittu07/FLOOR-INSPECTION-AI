# Pings the free Render backend so it does not sleep after 15 minutes of inactivity
# (a sleeping instance takes ~50 s to answer the first request).
# One always-on free web service fits within Render's 750 free instance-hours per month.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 https://floor-inspection-api.onrender.com/health; then
              echo; echo "Backend is awake"; exit 0
            fi
            sleep 10
          done
          echo "Backend did not respond"; exit 1
