version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floor-inspection-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_outputs:/app/outputs
      - backend_captures:/app/captures
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost,https://yourdomain.com
      - CRACK_CONFIDENCE_THRESHOLD=0.25
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: floor-inspection-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  backend_outputs:
  backend_captures:
